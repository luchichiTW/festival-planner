<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chiparashi — 音樂祭排團工具</title>
<meta name="description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="chiparashi — 音樂祭排團工具">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="https://chiparashi.tw/">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1EEEC" id="themeColor">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231A1617'/%3E%3Crect x='7' y='8' width='4.5' height='16' rx='2.25' fill='%23D9474A'/%3E%3Crect x='13.75' y='12' width='4.5' height='12' rx='2.25' fill='%23F1BE48'/%3E%3Crect x='20.5' y='6' width='4.5' height='14' rx='2.25' fill='%2317A7B4'/%3E%3C/svg%3E">
<!-- Homepage of chiparashi.tw, generated by scripts/build.mjs site from events/*/event.json. One self-contained file. -->
<script>
  // Theme before first paint: the saved choice, else the system's.
  (() => { let t = null; try { t = localStorage.getItem('fp:home:theme'); } catch (e) {}
    document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); })();
</script>
<style>
:root {
  --bg: #F1EEEC; --surface: #FBFAF9; --line: rgb(60 30 25 / .10); --line-2: rgb(60 30 25 / .18);
  --fg: #231C1B; --muted: #6B5F59; --faint: #94877F; --accent: #9A5F0A;
  --body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1A1617; --surface: #252020; --line: rgb(255 236 220 / .08); --line-2: rgb(255 236 220 / .16);
  --fg: #F6EEE5; --muted: #AA9D92; --faint: #7D7068; --accent: #F1BE48;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
  font: 16px/1.6 var(--body);
  padding: 0 max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left));
}
.wrap { max-width: 620px; margin: 0 auto; }
a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(12px + env(safe-area-inset-top)) 0 0; }
.brand { font-weight: 700; font-size: 15px; letter-spacing: .02em; color: var(--muted); }
.hdr-btn {
  flex: none; appearance: none; width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 999px;
  background: var(--surface); box-shadow: inset 0 0 0 .5px var(--line-2); color: var(--fg); cursor: pointer;
}
.hdr-btn svg { width: 19px; height: 19px; }
.hdr-btn .i-moon, :root[data-theme="light"] .hdr-btn .i-sun { display: none; }
:root[data-theme="light"] .hdr-btn .i-moon { display: block; }

h1 { margin: 28px 0 8px; font-size: 30px; line-height: 1.25; font-weight: 800; letter-spacing: .01em; text-wrap: balance; }
.lede { margin: 0 0 24px; color: var(--muted); font-size: 15px; text-wrap: pretty; }

.evs { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.ev {
  --c: var(--cl);
  display: grid; grid-template-columns: 60px 1fr; gap: 14px; align-items: center;
  padding: 14px 16px; border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 .5px var(--line-2);
  color: var(--fg); text-decoration: none; -webkit-tap-highlight-color: transparent; transition: transform .15s ease;
}
:root[data-theme="dark"] .ev { --c: var(--cd); }
.ev:active { transform: scale(.98); }
.ev-icon { width: 60px; height: 60px; border-radius: 14px; display: block; box-shadow: 0 0 0 .5px var(--line); }
.ev-body { min-width: 0; display: grid; gap: 2px; }
.ev-name { font-size: 18px; line-height: 1.35; font-weight: 700; overflow-wrap: anywhere; }
.ev-sub { font-size: 14px; line-height: 1.45; color: var(--muted); overflow-wrap: anywhere; text-wrap: pretty; }
.ev-status { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--c); }
.ev-status::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.ev-status:empty { display: none; }
.ev[data-state="past"] .ev-status, .ev[data-state="tba"] .ev-status { color: var(--faint); font-weight: 500; }

.make { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); }
.make h2 { margin: 0 0 6px; font-size: 17px; line-height: 1.4; }
.make p { margin: 0 0 6px; font-size: 15px; color: var(--muted); }
footer { margin: 28px 0 0; padding-bottom: 28px; font-size: 13px; color: var(--faint); }
@media (prefers-reduced-motion: reduce) { .ev { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">chiparashi</span>
    <button type="button" class="hdr-btn" id="themeBtn" aria-label="切換成淺色模式">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none"/></svg>
    </button>
  </header>
  <main>
    <h1>音樂祭排團工具</h1>
    <p class="lede">看時間表、排出自己的團序、撞團時抽籤決定。加到手機主畫面後，現場沒訊號也能開。</p>
    <ul class="evs" id="evs">
{{cards}}
    </ul>
    <section class="make">
      <h2>自己做一個</h2>
      <p>想幫別的音樂祭做一份？程式碼和做法都公開在 GitHub。</p>
      <a href="{{repo}}">{{repoLabel}}</a>
    </section>
  </main>
  <footer>非官方工具。演出異動以主辦方現場公告為準。</footer>
</div>
<script>
(() => {
  const EVENTS = {{events}};
  /* ---------- where each event stands today, in its own time zone ---------- */
  const today = (tz) => new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  const utc = (iso) => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const list = document.getElementById('evs');
  const rows = EVENTS.map((ev) => {
    const a = list.querySelector(`.ev[href="${ev.slug}/"]`);
    const t = today(ev.tz);
    if (!ev.days.length) { // announced by name only
      a.dataset.state = 'tba';
      a.querySelector('.ev-status').textContent = '日期待公布';
      return { li: a.closest('li'), state: 'tba', first: '', last: '' };
    }
    const first = ev.days[0].date;
    const last = ev.days[ev.days.length - 1].date;
    const on = ev.days.find((d) => d.date === t);
    let state; let text;
    if (on) { state = 'now'; text = `今天 · ${on.label}`; }
    else if (t < first) { const n = Math.round((utc(first) - utc(t)) / 864e5); state = 'soon'; text = n === 1 ? '明天開始' : `還有 ${n} 天`; }
    else if (t > last) { state = 'past'; text = '已結束'; }
    else { state = 'now'; text = '進行中'; }
    a.dataset.state = state;
    a.querySelector('.ev-status').textContent = text;
    return { li: a.closest('li'), state, first, last };
  });
  // Coming up (soonest first), then the ones waiting for dates, then the ones that are over (most recent first).
  const rank = { now: 0, soon: 0, tba: 1, past: 2 };
  rows.sort((x, y) => rank[x.state] - rank[y.state] || (x.state === 'past' ? y.last.localeCompare(x.last) : x.first.localeCompare(y.first)));
  rows.forEach((r) => list.append(r.li));

  /* ---------- light / dark ---------- */
  const KEY = 'fp:home:theme';
  const root = document.documentElement;
  const btn = document.getElementById('themeBtn');
  const meta = document.getElementById('themeColor');
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const system = () => (mq.matches ? 'dark' : 'light');
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { /* private mode: follow the system */ }
  const apply = (mode) => {
    root.dataset.theme = mode;
    btn.setAttribute('aria-label', mode === 'dark' ? '切換成淺色模式' : '切換成深色模式');
    meta.content = mode === 'dark' ? '#1A1617' : '#F1EEEC';
  };
  apply(saved === 'light' || saved === 'dark' ? saved : system());
  btn.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    // Choosing what the system already shows means "follow the system" again.
    saved = next === system() ? null : next;
    try { if (saved) localStorage.setItem(KEY, saved); else localStorage.removeItem(KEY); } catch (e) { /* not saved; still switches */ }
    apply(next);
  });
  try { mq.addEventListener('change', () => { if (!saved) apply(system()); }); } catch (e) { /* old Safari: the button still works */ }
})();
</script>
</body>
</html>
