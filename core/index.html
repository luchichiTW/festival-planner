<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="fp-build" content="{{build}}">
{{head}}
</head>
<body>
<!-- fp:body -->
<div class="app">
  <header class="top" id="top">
    <h1 class="wordmark">{{wordmark}}<small>{{wordmarkSub}}</small></h1>
    <div class="seg days" id="dayTabs" aria-label="日期">
{{dayTabs}}
    </div>
    <div class="tools">
      <button type="button" class="theme-btn search-btn" id="searchBtn" aria-label="搜尋藝人">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none"/><path d="M20 20l-4.2-4.2"/></svg>
      </button>
      <button type="button" class="theme-btn" id="themeBtn" aria-label="切換成淺色模式">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none"/></svg>
      </button>
    </div>
  </header>

  <!-- fp:web -->
  <div class="hint-bar" id="installHint" hidden>
    <p><b>先加入主畫面再排團</b>：點 Safari 的「分享」→「加入主畫面」。主畫面版和 Safari 的團序是分開的，沒網路也能開。</p>
    <button type="button" id="installOk">知道了</button>
  </div>
  <!-- /fp:web -->

  <div class="next" id="nextBar" aria-live="polite" hidden></div>

  <main class="view">
    <section class="pick" id="pickView" aria-label="時間表">
      <div class="board" id="board"><div class="grid" id="grid"></div></div>
      <div class="coach" id="coach" hidden>
        <p>點一下把表演加進團序，再點一次取消。長按可以看藝人介紹和試聽；變淡的是跟已選時段重疊的團。</p>
        <button type="button" id="coachOk">知道了</button>
      </div>
    </section>
    <section class="mine" id="mineView" aria-label="我的團序" hidden>
      <div class="mine-in" id="mineIn"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="頁面">
    <button type="button" id="tabPick" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2.5" fill="none"/><path d="M9.5 4v16M15 4v16M3.5 9h17"/></svg>
      排團
    </button>
    <button type="button" id="tabMine" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="5" cy="6.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="5" cy="17.5" r="1.3" fill="currentColor" stroke="none"/></svg>
      我的團序
      <span class="tb-badges"><span id="tabCount" hidden>0</span><span class="tb-clash" id="tabClash" hidden>撞</span></span>
    </button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
<div class="sp-scrim" id="spScrim" hidden></div>
<div class="sp" id="sp" role="dialog" aria-modal="true" aria-label="搜尋藝人" hidden>
  <div class="sp-bar">
    <label class="sp-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="spInput" type="search" placeholder="團名，中英文都可以" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="搜尋團名">
    </label>
    <button type="button" class="sp-x" id="spClose">取消</button>
  </div>
  <div class="sp-res" id="spRes"></div>
</div>
<div class="lp-backdrop" id="lpBackdrop" hidden></div>
<div class="lp-card" id="lpCard" role="dialog" aria-modal="true" aria-labelledby="lpName" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- /fp:body -->
{{scripts}}
</body>
</html>
