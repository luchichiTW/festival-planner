<!doctype html>
<html lang="{{lang}}" class="nojs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="fp-build" content="{{build}}">
<script>document.documentElement.classList.remove('nojs')</script>
{{head}}
</head>
<body>
<!-- fp:body -->
<div class="app">
  <header class="top" id="top">
    <h1 class="wordmark"><span id="wordmarkText">{{wordmark}}</span><small>{{wordmarkSub}}</small></h1>
    <p class="top-sub" id="topSub">{{subtitle}}</p>
{{langBtn}}
    <button type="button" class="hdr-btn" id="themeBtn" aria-label="切換成淺色模式">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none"/></svg>
    </button>
  </header>

  <main class="view">
    <section class="pick" id="pickView" aria-label="時間表" data-i18n-attr="aria-label">
      <div class="board" id="board"><div class="grid" id="grid"></div></div>
    </section>
    <section class="mine" id="mineView" aria-label="我的團序" data-i18n-attr="aria-label" hidden>
      <div class="mine-in" id="mineIn"></div>
    </section>
{{static}}
  </main>

  <!-- Everything you tap often sits here, in reach of the thumb. -->
  <div class="dock" id="dock">
    <div class="next" id="nextBar" aria-live="polite" hidden></div>
    <nav class="dock-row" aria-label="頁面" data-i18n-attr="aria-label">
      <div class="tabbar">
{{dayTabs}}
        <button type="button" class="tab" id="tabMine" aria-pressed="false"><b data-i18n>我的團序</b><span class="tab-sub" id="mineSub">0 團</span></button>
      </div>
{{mapBtn}}
      <button type="button" class="dock-btn" id="searchBtn" aria-label="搜尋藝人" data-i18n-attr="aria-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none"/><path d="M20 20l-4.2-4.2"/></svg>
      </button>
    </nav>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" hidden></div>
<div class="sp-scrim" id="spScrim" hidden></div>
<div class="sp" id="sp" role="dialog" aria-modal="true" aria-label="搜尋藝人" data-i18n-attr="aria-label" hidden>
  <div class="sp-res" id="spRes"></div>
  <div class="sp-bar">
    <label class="sp-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="spInput" type="search" placeholder="團名，中英文都可以" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="搜尋團名" data-i18n-attr="placeholder aria-label">
    </label>
    <button type="button" class="sp-x" id="spClose" data-i18n>取消</button>
  </div>
</div>
<div class="lp-backdrop" id="lpBackdrop" hidden></div>
<div class="lp-card" id="lpCard" role="dialog" aria-modal="true" aria-labelledby="lpName" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- /fp:body -->
{{scripts}}
</body>
</html>
